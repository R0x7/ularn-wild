name: Sync web port

# Lives on main (and, via the merges, on the web branch too).
# Every push to main is merged into the web branch (WEB_BRANCH), which is
# then built and published to GitHub Pages
# (https://r0x7.github.io/ularn-wild/). The two branches stay separate: the
# web branch is main plus web/ and these workflows. upstream-sync.yml starts
# this by hand after it merges android-ularn's main, because a push made with
# Actions' token does not start other workflows.
#
# If the merge conflicts, or GitHub refuses the push (Actions' token may not
# push commits that change files under .github/workflows/), the run says so;
# merge by hand once (git merge main on the web branch) and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEB_BRANCH: ularn-web

permissions:
  contents: write   # push the web branch and gh-pages

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Emscripten's own image (same version as Ubuntu 24.04's package, which
    # the web build is tested with): no apt install that can hang.
    container: emscripten/emsdk:3.1.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_BRANCH }}
          fetch-depth: 0
      - name: Merge main into the web branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          if ! git merge --no-edit -m "Merge main into ${WEB_BRANCH} (auto)" origin/main; then
            git merge --abort || true
            echo "::error::main does not merge cleanly into ${WEB_BRANCH}; merge it by hand."
            exit 1
          fi
      - name: Push the web branch
        id: push
        continue-on-error: true
        run: git push origin "HEAD:${WEB_BRANCH}"
      - name: Warn if the push was refused
        if: steps.push.outcome == 'failure'
        run: echo "::warning::Could not push ${WEB_BRANCH} (probably a workflow file changed on main). The site is still published from the merged code; merge main into ${WEB_BRANCH} by hand to catch the branch up."
      - name: Build
        run: web/build.sh
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: web/publish.sh "main $(git rev-parse --short origin/main) merged into ${WEB_BRANCH}"
