name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ULARN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ularn.keystore"
            echo "ULARN_KEYSTORE=$RUNNER_TEMP/ularn.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ULARN_KEYSTORE_B64 secret not set; using a random debug key (updates won't install over older builds)"
          fi
      - name: Build debug APK
        env:
          ULARN_KEYSTORE_PASSWORD: ${{ secrets.ULARN_KEYSTORE_PASSWORD }}
        # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle installs
        # the NDK and CMake versions it needs on first build.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ularn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-debug-apk
          path: ularn.apk

      # Wild Edition repo: every push to main updates one prerelease, so this link always
      # gets the newest experimental build:
      # https://github.com/<owner>/<repo>/releases/download/wild-latest/ularn-wild.apk
      - name: Publish Wild Edition prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        # The release action only sets target_commitish when it creates the
        # tag, so wild-latest stayed on the first commit it was made from.
        # Move the tag to this build's commit; if GitHub refuses (Actions'
        # token may not push some refs), delete the prerelease and its tag so
        # the next step makes them again at this commit.
        run: |
          cp ularn.apk ularn-wild.apk
          git tag -f wild-latest "$GITHUB_SHA"
          if ! git push -f origin refs/tags/wild-latest; then
            echo "::notice::Could not move the wild-latest tag; recreating the prerelease at ${GITHUB_SHA::7}."
            gh release delete wild-latest --cleanup-tag --yes || true
          fi
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          tag_name: wild-latest
          name: Ularn Wild Edition (experimental, build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: ularn-wild.apk
          body: |
            **Experimental.** Installs beside the normal Ularn app as "Ularn Wild" with its own saves.
            What's in it: docs/WILD_EDITION_PLAN.md and docs/wild/*.md on the branch.

            Always-newest link: https://github.com/${{ github.repository }}/releases/download/wild-latest/ularn-wild.apk

            Commit: ${{ github.sha }}

      # Every push to main becomes a release, so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/ularn.apk
      # Not in the R0x7/ularn-wild repo, which merges this file in from here
      # and publishes its own wild-latest prerelease instead.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.name != 'ularn-wild'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ularn build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ularn.apk
          body: |
            Install on your phone: open this page in the phone's browser and tap **ularn.apk**.
            Android will ask once to allow installs from your browser.

            Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/ularn.apk

            Commit: ${{ github.sha }}
