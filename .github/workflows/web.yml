name: Web build (GitHub Pages)

# Builds the browser version (web/, Emscripten) and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/
# (Settings -> Pages -> Deploy from a branch -> gh-pages, / (root)).
#
# This runs for pushes to the web branch itself. Pushes to main are
# handled by web-sync.yml (on main), which merges them into the web
# branch and publishes in one go.
on:
  push:
    branches: [ularn-web]
    paths: [web/**, app/src/main/cpp/**, app/src/main/assets/**, .github/workflows/web*.yml]
  workflow_dispatch:

permissions:
  contents: write   # to push the gh-pages branch

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Emscripten's own image, pinned to the version the web build is tested
    # with (Ubuntu 24.04's apt package is also 3.1.6). No package install, so
    # a hung apt mirror can't stall publishing.
    container: emscripten/emsdk:3.1.6
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-web
          path: web/site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: web/publish.sh "${GITHUB_REF_NAME} ${GITHUB_SHA}"
